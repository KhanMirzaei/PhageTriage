name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Validate shell scripts
        run: make syntax
      - name: Run tests
        run: make test
      - name: Validate Snakemake DAG
        run: make dry-run

