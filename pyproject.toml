[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phagetriage"
version = "0.7.0"
description = "Evidence-first screening of phage contigs for therapy research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PhageTriage contributors"}]
dependencies = ["snakemake>=9,<10"]

[project.scripts]
phagetriage = "phagetriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phagetriage = ["workflow/Snakefile", "workflow/envs/*.yaml", "workflow/scripts/*.py"]
